<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Management">
<title>Arena Management System</title>
<link rel="stylesheet" href="shell.css">
<script>/* stamp the theme before first paint; shared with ice.html and glass.html */
try{var _t=localStorage.getItem("rink_theme");}catch(e){}
document.documentElement.setAttribute("data-theme",_t==="light"?"light":"dark");</script>

<div id="shell"></div>

<script src="sync.js"></script>
<script src="records.js"></script>
<script src="shell.js"></script>
<script src="home.js"></script>
<script>
/* Nothing about the rinks is read or drawn until the sign-in gate has been passed. */
Shell.mount(document.getElementById("shell"), Home);
</script>

<script>
/* PWA: install this page and its siblings so the suite opens and works offline. */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{/* file:// or unsupported host - the page still works, just not offline-installable */});});
}
</script>
