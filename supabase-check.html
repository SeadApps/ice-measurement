<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supabase setup check</title>
<style>
  :root{
    --bg:#0d1620; --glow:#16283a; --panel:#152433; --panel-2:#1c3142; --line:#273d4f;
    --ink:#eaf3f8; --ink-dim:#90a8b8; --ink-faint:#5d7384; --frost:#6fd6ec;
    --good:#7fcf9a; --bad:#e5645d; --warn:#e8b54a;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%, var(--glow) 0%, transparent 60%), var(--bg);
    color:var(--ink);font-family:var(--sans);padding:26px 18px 60px}
  .wrap{max-width:680px;margin:0 auto}
  h1{margin:0 0 4px;font-size:21px;font-weight:800;display:flex;align-items:baseline;gap:9px}
  h1 .mark{font-family:var(--mono);color:var(--frost);font-size:16px}
  .sub{font-size:12.5px;color:var(--ink-dim);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:7px}
  input{font:inherit;font-size:16px;height:44px;padding:0 14px;border-radius:10px;width:100%;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  input:focus{outline:2px solid var(--frost);outline-offset:-1px}
  .row{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
  button{appearance:none;font:inherit;font-size:14px;font-weight:700;height:44px;padding:0 20px;border:0;
    border-radius:10px;background:var(--frost);color:#06222b;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  ol{list-style:none;margin:0;padding:0}
  li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
  li:last-child{border-bottom:0}
  .mk{font-family:var(--mono);font-size:13px;font-weight:700;flex:none;width:20px;text-align:center;padding-top:1px}
  .pass .mk{color:var(--good)} .fail .mk{color:var(--bad)} .warnrow .mk{color:var(--warn)}
  .run .mk{color:var(--ink-faint)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-weight:600;margin-bottom:2px}
  .txt span{color:var(--ink-dim);font-size:12.5px;word-break:break-word}
  .fail .txt b{color:var(--bad)} .warnrow .txt b{color:var(--warn)}
  .verdict{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:14px;display:none}
  .verdict.on{display:block}
  .verdict.ok{background:#173026;border:1px solid #2f5e44;color:var(--good)}
  .verdict.no{background:#301c1b;border:1px solid #6d3330;color:var(--bad)}
  textarea{width:100%;margin-top:12px;height:150px;font-family:var(--mono);font-size:11.5px;
    background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);border-radius:10px;padding:10px;display:none}
  textarea.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="mark">[ &#9671; ]</span> Supabase setup check</h1>
  <p class="sub">Runs eight checks against your project from this browser. Nothing is kept &mdash; the probe row it
     writes is deleted at the end, and the code you type is never stored.</p>

  <div class="card">
    <label for="email">Account email &mdash; exactly as it appears under Authentication &rarr; Users</label>
    <input id="email" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
           value="operations@conwayarena.local" style="margin-bottom:14px">
    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="the crew code">
    <div class="row">
      <button id="run">Run checks</button>
      <button class="ghost" id="copy" style="display:none">Copy results</button>
    </div>
  </div>

  <div class="card"><ol id="list"></ol>
    <div class="verdict" id="verdict"></div>
    <textarea id="out" readonly></textarea>
  </div>
</div>

<script>
const URL_ = "https://uiocwdacgbhjccodwrcy.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpb2N3ZGFjZ2JoamNjb2R3cmN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTk4MjYsImV4cCI6MjEwNDEzNTgyNn0.Em_cz0Buz3bmjplvwthfWo04EBVz1bHYP4v9YxRt6N4";
const PROBE = "__setup_check_" + Math.random().toString(36).slice(2,8);

const list=document.getElementById('list'), out=document.getElementById('out'),
      verdict=document.getElementById('verdict'), runBtn=document.getElementById('run'),
      copyBtn=document.getElementById('copy');
const log=[];
function row(name){
  const li=document.createElement('li'); li.className='run';
  li.innerHTML='<span class="mk">…</span><span class="txt"><b>'+name+'</b><span></span></span>';
  list.appendChild(li); return li;
}
function mark(li,state,detail){
  li.className = state==='pass'?'pass':state==='warn'?'warnrow':'fail';
  li.querySelector('.mk').textContent = state==='pass'?'✓':state==='warn'?'!':'✕';
  li.querySelector('.txt span').textContent = detail||'';
  log.push((state==='pass'?'PASS  ':state==='warn'?'WARN  ':'FAIL  ')+li.querySelector('b').textContent+(detail?' — '+detail:''));
}
const H=(tok)=>({ "apikey":ANON, "Content-Type":"application/json",
                  ...(tok?{"Authorization":"Bearer "+tok}:{}) });

async function main(){
  const code=document.getElementById('code').value;
  if(!code){ document.getElementById('code').focus(); return; }
  runBtn.disabled=true; runBtn.textContent='Running…'; list.innerHTML=''; log.length=0;
  verdict.className='verdict'; out.className='';
  let token=null, hardFail=false;

  // 1 — is the project awake and reachable
  let li=row('Project is reachable');
  try{
    const r=await fetch(URL_+"/auth/v1/health",{headers:H()});
    r.ok ? mark(li,'pass','HTTP '+r.status+' — project is awake')
         : mark(li,'fail','HTTP '+r.status+' — may be paused');
    if(!r.ok) hardFail=true;
  }catch(e){ mark(li,'fail',String(e.message||e)); hardFail=true; }

  // 2 — the table exists
  li=row('The records table exists');
  try{
    const r=await fetch(URL_+"/rest/v1/records?select=id&limit=1",{headers:H()});
    if(r.status===404||r.status===400){ mark(li,'fail','not found — did the SQL run?'); hardFail=true; }
    else mark(li,'pass','responds to queries');
  }catch(e){ mark(li,'fail',String(e.message||e)); hardFail=true; }

  // 3 — anonymous access must get nothing
  li=row('Locked to signed-in users only');
  try{
    const r=await fetch(URL_+"/rest/v1/records?select=*&limit=5",{headers:H()});
    const b=await r.text();
    const empty = b.trim()==='[]' || !r.ok;
    empty ? mark(li,'pass','a stranger with the key sees nothing')
          : mark(li,'fail','ANYONE CAN READ THIS — row level security is off');
    if(!empty) hardFail=true;
  }catch(e){ mark(li,'fail',String(e.message||e)); }

  // 4 — the crew account signs in
  li=row('The access code works');
  try{
    const r=await fetch(URL_+"/auth/v1/token?grant_type=password",{method:'POST',headers:H(),
      body:JSON.stringify({email:document.getElementById('email').value.trim(),password:code})});
    const j=await r.json();
    if(j.access_token){ token=j.access_token; mark(li,'pass','signed in as the crew account'); }
    else {
      const raw=String(j.error_description||j.msg||j.error||'sign-in refused');
      const hint = /not confirmed/i.test(raw) ? ' — the account exists but is unconfirmed: edit the user and confirm it'
                 : /invalid login/i.test(raw) ? ' — email or code does not match the account'
                 : '';
      mark(li,'fail',raw+hint); hardFail=true;
    }
  }catch(e){ mark(li,'fail',String(e.message||e)); hardFail=true; }

  // 5 — signed in, can write
  li=row('Signed in, can save');
  if(token){
    try{
      const r=await fetch(URL_+"/rest/v1/records",{method:'POST',
        headers:{...H(token),"Prefer":"return=representation"},
        body:JSON.stringify([{id:PROBE,kind:"probe",body:{hello:"world"}}])});
      const j=await r.json();
      Array.isArray(j)&&j.length ? mark(li,'pass','wrote a test row')
                                 : mark(li,'fail',JSON.stringify(j).slice(0,140));
      if(!(Array.isArray(j)&&j.length)) hardFail=true;
    }catch(e){ mark(li,'fail',String(e.message||e)); hardFail=true; }
  } else mark(li,'fail','skipped — no sign-in');

  // 6 — and read it back
  li=row('Signed in, can read');
  if(token){
    try{
      const r=await fetch(URL_+"/rest/v1/records?id=eq."+PROBE+"&select=*",{headers:H(token)});
      const j=await r.json();
      j.length ? mark(li,'pass','read the row back') : mark(li,'fail','row not found');
      if(!j.length) hardFail=true;
    }catch(e){ mark(li,'fail',String(e.message||e)); hardFail=true; }
  } else mark(li,'fail','skipped — no sign-in');

  // 7 — the server must set the time, not the device
  li=row('Server sets the timestamp');
  if(token){
    try{
      const r=await fetch(URL_+"/rest/v1/records?id=eq."+PROBE+"&kind=eq.probe",{method:'PATCH',
        headers:{...H(token),"Prefer":"return=representation"},
        body:JSON.stringify({body:{hello:"again"},updated_at:"1999-01-01T00:00:00Z"})});
      const j=await r.json();
      const t=j[0]&&j[0].updated_at||'';
      t.startsWith('1999') ? mark(li,'fail','device clock was trusted — the trigger is missing')
                           : mark(li,'pass','ignored a bogus 1999 date, stamped '+t.slice(0,19));
      if(t.startsWith('1999')) hardFail=true;
    }catch(e){ mark(li,'fail',String(e.message||e)); }
  } else mark(li,'fail','skipped — no sign-in');

  // 8 — nobody can create their own account
  li=row('Public signups are off');
  try{
    const r=await fetch(URL_+"/auth/v1/signup",{method:'POST',headers:H(),
      body:JSON.stringify({email:"probe_"+Date.now()+"@example.com",password:"Xy8!kq2vLm"})});
    const j=await r.json();
    if(j.access_token||j.id||j.user) mark(li,'warn','a stranger CAN create an account — turn signups off');
    else mark(li,'pass','refused: '+String(j.msg||j.error_description||j.error||'blocked').slice(0,70));
  }catch(e){ mark(li,'warn','could not test — check 1 probably failed too'); }

  // tidy up
  li=row('Test row removed');
  if(token){
    try{
      await fetch(URL_+"/rest/v1/records?id=eq."+PROBE,{method:'DELETE',headers:H(token)});
      const r=await fetch(URL_+"/rest/v1/records?id=eq."+PROBE+"&select=id",{headers:H(token)});
      const j=await r.json();
      j.length ? mark(li,'warn','left behind — delete id '+PROBE+' by hand') : mark(li,'pass','cleaned up');
    }catch(e){ mark(li,'warn','could not remove '+PROBE); }
  } else mark(li,'pass','nothing written');

  verdict.className='verdict on '+(hardFail?'no':'ok');
  verdict.textContent = hardFail
    ? "Something needs fixing — send me the results below and I'll tell you which step to redo."
    : "All good. Send me the results and I'll build the sync against it.";
  out.value = log.join('\n');
  out.className='on'; copyBtn.style.display='';
  runBtn.disabled=false; runBtn.textContent='Run again';
}
runBtn.addEventListener('click',main);
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')main();});
copyBtn.addEventListener('click',()=>{out.select();document.execCommand('copy');copyBtn.textContent='Copied';
  setTimeout(()=>copyBtn.textContent='Copy results',1500);});
</script>
</body>
</html>
