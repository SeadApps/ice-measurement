# Keeps the Supabase project from sleeping.
#
# Free projects pause after about a week with no requests. This makes one
# harmless read every three days so that never happens. The key below is the
# public anon key — the same one already in sync.js — and on its own it grants
# no access to any data.
#
# Note: GitHub switches scheduled workflows off if the repo goes 60 days with
# no commits. It emails you; re-enable it from the Actions tab in one click.

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 7 */3 * *"   # 07:00 UTC, every third day
  workflow_dispatch:        # and a button, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the project
        run: |
          URL="https://uiocwdacgbhjccodwrcy.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpb2N3ZGFjZ2JoamNjb2R3cmN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTk4MjYsImV4cCI6MjEwNDEzNTgyNn0.Em_cz0Buz3bmjplvwthfWo04EBVz1bHYP4v9YxRt6N4"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
                 -H "apikey: $KEY" "$URL/rest/v1/records?select=id&limit=1")
          echo "project answered HTTP $code"
          case "$code" in
            200|401) echo "awake" ;;
            *) echo "unexpected — the project may be paused"; exit 1 ;;
          esac
